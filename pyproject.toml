[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visigui"
version = "0.1.0"
description = "A hand-controlled procedural 3D world with a retained terminal Python project explorer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "opencv-python>=4.10.0",
    "mediapipe>=1.0.1",
    "PyQt6>=6.7.0",
    "PyOpenGL>=3.1.7",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
visigui = "visigui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
